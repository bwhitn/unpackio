[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "unpackio"
version = "0.2.0"
description = "Security-focused, unpack-only multi-format archive and compressed-stream reader"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*", "NOTICE"]
authors = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Homepage = "https://github.com/bwhitn/unpackio"
Repository = "https://github.com/bwhitn/unpackio"
Documentation = "https://github.com/bwhitn/unpackio/blob/main/API.md"

[tool.maturin]
bindings = "pyo3"
features = ["extension-module"]
module-name = "unpackio._native"
python-source = "python"
strip = true
exclude = [
  { path = "dist*/**", format = "sdist" },
  { path = "python/**/__pycache__/**", format = "wheel" },
  { path = "python/**/*.pyc", format = "wheel" },
  { path = "python/**/*.pyo", format = "wheel" },
]
