name: python

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binding-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path bindings/python/Cargo.toml -- --check
      - run: cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path bindings/python/Cargo.toml --no-default-features --lib --locked
      - run: cargo check --manifest-path bindings/python/Cargo.toml --all-features --locked
      - name: Build source distribution
        run: |
          python -m pip install maturin==1.15.0
          maturin sdist --manifest-path bindings/python/Cargo.toml --out bindings/python/dist
      - name: Verify source distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archives = list(Path("bindings/python/dist").glob("unpackio-*.tar.gz"))
          assert len(archives) == 1, archives
          with tarfile.open(archives[0], "r:gz") as source:
              names = source.getnames()
          relative_parts = [PurePosixPath(name).parts[1:] for name in names]
          nested_artifacts = [
              name
              for name, parts in zip(names, relative_parts, strict=True)
              if name.endswith(".whl")
              or any(part == "dist" or part.startswith("dist-") for part in parts)
          ]
          assert not nested_artifacts, nested_artifacts
          PY
      - name: Rebuild wheel from source distribution
        run: >-
          python -m pip wheel --no-deps
          bindings/python/dist/unpackio-0.2.0.tar.gz
          --wheel-dir bindings/python/dist/from-sdist
      - name: Install rebuilt source-distribution wheel
        run: python -m pip install --no-index --find-links bindings/python/dist/from-sdist unpackio
      - name: Test rebuilt source-distribution wheel
        run: python -m unittest discover -s bindings/python/tests -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unpackio-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  binding-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - run: cargo check --manifest-path bindings/python/Cargo.toml --all-features --locked

  wheels:
    name: wheel-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            manylinux: "2_17"
            target: x86_64-unknown-linux-gnu
            build-python-architecture: x64
            wheel_arch: x86_64
          - name: linux-aarch64
            os: ubuntu-latest
            manylinux: "2_17"
            target: aarch64-unknown-linux-gnu
            build-python-architecture: x64
            wheel_arch: aarch64
          - name: macos-x86_64
            os: macos-15-intel
            manylinux: "off"
            target: x86_64-apple-darwin
            build-python-architecture: x64
            wheel_arch: x86_64
          - name: macos-arm64
            os: macos-15
            manylinux: "off"
            target: aarch64-apple-darwin
            build-python-architecture: arm64
            wheel_arch: arm64
          - name: windows-x86_64
            os: windows-latest
            manylinux: "off"
            target: x86_64-pc-windows-msvc
            build-python-architecture: x64
            wheel_arch: win_amd64
          - name: windows-arm64
            os: windows-11-arm
            manylinux: "off"
            target: aarch64-pc-windows-msvc
            build-python-architecture: arm64
            wheel_arch: win_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.build-python-architecture }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.15.0
          manylinux: ${{ matrix.manylinux }}
          target: ${{ matrix.target }}
          args: >-
            --manifest-path bindings/python/Cargo.toml
            --release
            --locked
            --compatibility pypi
            --out bindings/python/dist
      - name: Verify CPython 3.9 ABI3 wheel tag
        env:
          EXPECTED_WHEEL_ARCH: ${{ matrix.wheel_arch }}
        run: >-
          python -c "import os; from pathlib import Path;
          wheels=list(Path('bindings/python/dist').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          name=wheels[0].name;
          assert 'cp39-abi3' in name, name;
          assert os.environ['EXPECTED_WHEEL_ARCH'] in name, name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unpackio-${{ matrix.name }}-wheel
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  wheel-smoke:
    name: smoke-${{ matrix.platform }}-python-${{ matrix.python-version }}
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        platform:
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-arm64
          - windows-x86_64
          - windows-arm64
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            architecture: x64
            artifact: unpackio-linux-x86_64-wheel
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            architecture: arm64
            artifact: unpackio-linux-aarch64-wheel
          - platform: macos-x86_64
            os: macos-15-intel
            architecture: x64
            artifact: unpackio-macos-x86_64-wheel
          - platform: macos-arm64
            os: macos-15
            architecture: arm64
            artifact: unpackio-macos-arm64-wheel
          - platform: windows-x86_64
            os: windows-latest
            architecture: x64
            artifact: unpackio-windows-x86_64-wheel
          - platform: windows-arm64
            os: windows-11-arm
            architecture: arm64
            artifact: unpackio-windows-arm64-wheel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: bindings/python/dist
      - name: Install built wheel
        run: python -m pip install --no-index --find-links bindings/python/dist unpackio
      - name: Verify interpreter and installed distribution
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: >-
          python -c "import importlib.metadata, os, sys, unpackio;
          expected=tuple(int(part) for part in os.environ['EXPECTED_PYTHON'].split('.'));
          assert sys.version_info[:2] == expected, sys.version;
          assert importlib.metadata.version('unpackio') == '0.2.0';
          assert unpackio.__version__ == '0.2.0'"
      - name: Test installed wheel
        run: python -m unittest discover -s bindings/python/tests -v
