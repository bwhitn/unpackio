[package]
name = "unpackio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Security-focused, unpack-only 7z, ZIP, RPM, Debian, CPIO, ARJ, and stream core"
readme = "../../README.md"
keywords = ["7z", "archive", "decompression", "zip", "arj"]
categories = ["compression", "parser-implementations"]
publish = false

[lib]
name = "unpackio"
path = "src/lib.rs"

[features]
default = []
# Parser/model internals are exposed only for the dedicated structural
# regression suite and fuzz harnesses. They are not part of the stable API.
unstable-internals = []

[dependencies]
aes = { version = "=0.9.2", default-features = false, features = ["zeroize"] }
brotli-decompressor = { version = "=6.0.0", default-features = false, features = ["std"] }
bzip2-rs = { version = "=0.1.2", default-features = false, features = ["rustc_1_37"] }
cbc = { version = "=0.2.1", default-features = false, features = ["zeroize"] }
ctr = { version = "=0.10.1", default-features = false, features = ["zeroize"] }
delharc = { version = "=0.6.2", default-features = false }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["checked-decode", "frame", "safe-decode", "safe-encode"] }
lzma-rust2 = { version = "=0.20.1", default-features = false, features = ["std"] }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
rawzip = { version = "=0.5.1", default-features = false }
ruzstd = { version = "=0.8.1", default-features = false, features = ["hash", "std"] }
sha1 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
twox-hash = { version = "=2.1.4", default-features = false, features = ["xxhash32"] }
wavicle = { package = "unpackio-wavicle-decoder", version = "=0.1.0", path = "../../vendor/wavicle-decoder", default-features = false, features = ["decode"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[[bench]]
name = "natural_order_solid"
harness = false

[[bench]]
name = "archive_lifecycle"
harness = false

[[test]]
name = "phase2_model"
required-features = ["unstable-internals"]

[[test]]
name = "reference_headers"
required-features = ["unstable-internals"]

[lints]
workspace = true
